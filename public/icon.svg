<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#07090e" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" stroke="#1e293b" stroke-width="8" />

  <!-- Radar Reticle Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.3" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.4" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />

  <!-- Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="#38bdf8" stroke-width="2" opacity="0.35" />
  <line x1="56" y1="256" x2="456" y2="256" stroke="#38bdf8" stroke-width="2" opacity="0.35" />

  <!-- Gear Teeth Outer Profile -->
  <g fill="none" stroke="url(#cyanGrad)" stroke-width="12" stroke-linejoin="round" filter="url(#glow)">
    <circle cx="256" cy="256" r="140" />
  </g>

  <!-- Central Optical Core -->
  <circle cx="256" cy="256" r="42" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="256" cy="256" r="22" fill="#ffffff" />

  <!-- Optical Target Brackets -->
  <path d="M 176 196 L 176 176 L 196 176" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <path d="M 336 196 L 336 176 L 316 176" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <path d="M 176 316 L 176 336 L 196 336" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <path d="M 336 316 L 336 336 L 316 336" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
</svg>
